name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-unit.log
      - name: Assemble installable debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-assemble.log
      - name: Verify exported Room schema
        run: |
          schema="app/schemas/de.treker.habits.data.AppDatabase/3.json"
          if [ ! -f "$schema" ]; then
            echo "::error::Room schema was not exported to $schema"
            ls -R app/schemas 2>/dev/null || true
            exit 1
          fi
          python3 -c "import json,sys; data=json.load(open('$schema')); assert data['database']['version']==3; print('schema v3 ok, identityHash', data['database']['identityHash'])"
      - name: Upload exported Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas
          if-no-files-found: error
          retention-days: 30
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: treker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Run Android integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            bash -c 'adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; adb wait-for-device; adb devices; ./gradlew --stop >/dev/null 2>&1 || true; ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1280m -XX:MaxMetaspaceSize=384m" connectedDebugAndroidTest 2>&1 | tee gradle-android.log; status=${PIPESTATUS[0]}; adb logcat -d > logcat.txt 2>&1 || true; adb shell pm list packages > installed-packages.txt 2>&1 || true; exit $status'
      - name: Report Gradle diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          important = []
          reports = list(Path("app/build/test-results").rglob("*.xml")) + list(
              Path("app/build/outputs/androidTest-results").rglob("*.xml")
          )
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      header = f"{case.get('classname')} > {case.get('name')}"
                      message = (failure.get("message") or failure.get("type") or "").strip()
                      important.append(f"{header}: {message}".strip())
                      if failure.text:
                          important.extend(line.strip() for line in failure.text.splitlines()[:15] if line.strip())

          logcat = Path("logcat.txt")
          if logcat.exists():
              lines = logcat.read_text(errors="replace").splitlines()
              for index, line in enumerate(lines):
                  if "FATAL EXCEPTION" in line or "AndroidRuntime" in line and "FATAL" in line:
                      important.append("LOGCAT: " + line.strip())
                      important.extend(item.strip() for item in lines[index + 1:index + 25])
                      break

          log_lines = []
          marker = re.compile(
              r"(^e: |FAILED|FAILURE: Build failed|What went wrong:|Execution failed for task"
              r"|Unresolved reference|AssertionError|BUILD FAILED|Timeout waiting|INSTALL_FAILED"
              r"|Tests on |There were failing tests|Process crashed)",
              re.IGNORECASE,
          )
          for path in [Path("gradle-unit.log"), Path("gradle-assemble.log"), Path("gradle-android.log")]:
              if path.exists():
                  log_lines.extend(
                      line.strip() for line in path.read_text(errors="replace").splitlines() if marker.search(line)
                  )

          important = list(dict.fromkeys(important))[:20]
          log_lines = list(dict.fromkeys(log_lines))[-15:]
          messages = important + log_lines
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Test and build diagnostics" + chr(10) + chr(10))
              output.write((chr(10).join("- `" + message + "`" for message in messages) or "- No failures detected") + chr(10))
          for message in messages:
              safe = message.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
              print(f"::error::{safe[:4000]}")
          PY
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-*.log
            logcat.txt
            installed-packages.txt
            app/build/test-results/**/*.xml
            app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
