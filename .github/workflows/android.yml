name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-unit.log
      - name: Assemble installable debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-assemble.log
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: treker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Run Android integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -o pipefail
            ./gradlew --no-daemon connectedDebugAndroidTest 2>&1 | tee gradle-android.log
      - name: Report Gradle diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          paths = [Path("gradle-unit.log"), Path("gradle-android.log"), Path("gradle-assemble.log")]
          markers = re.compile(r"(^e: | error:|FAILED|FAILURE: Build failed|What went wrong:|Execution failed for task|Could not resolve|Could not find|Unresolved reference|AssertionError|BUILD FAILED|Tests on |There were failing tests|INSTALL_FAILED|Error:|Exception|emulator)", re.IGNORECASE)
          messages = []
          for path in paths:
              if path.exists():
                  lines = path.read_text(errors="replace").splitlines()
                  messages.extend(line.strip() for line in lines if markers.search(line))
          for report in list(Path("app/build/test-results").rglob("*.xml")) + list(Path("app/build/outputs/androidTest-results").rglob("*.xml")):
              try:
                  root = ET.parse(report).getroot()
                  for case in root.iter("testcase"):
                      for failure in list(case.findall("failure")) + list(case.findall("error")):
                          messages.append(f"{case.get('classname')} > {case.get('name')}: {failure.get('message', failure.get('type', 'test failure'))}")
                          if failure.text:
                              messages.extend(line.strip() for line in failure.text.splitlines()[:12])
              except ET.ParseError as error:
                  messages.append(f"Could not parse {report}: {error}")
          if not messages:
              for path in paths:
                  if path.exists(): messages.extend(path.read_text(errors="replace").splitlines()[-20:])
          messages = list(dict.fromkeys(messages))[-30:]
          summary = ["## Gradle diagnostics", ""] + [f"- `{message}`" for message in messages]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(chr(10).join(summary) + chr(10))
          for message in messages:
              safe = message.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
              print(f"::error::{safe[:4000]}")
          PY
      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-*.log
            app/build/test-results/**/*.xml
            app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
